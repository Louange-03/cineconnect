server {
    # Port 8080 : meme convention que l’API pour Coolify (domaine …:8080 → label Traefik fiable). Pas besoin de root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

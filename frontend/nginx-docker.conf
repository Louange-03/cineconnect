server {
    # Port 8080 : meme convention que l’API pour Coolify (domaine …:8080 → label Traefik fiable). Pas besoin de root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Meme stack Docker : le navigateur peut appeler /api en relatif (VITE_API_URL vide au build).
    # Sans ce bloc, /api/* renvoie index.html et la liste des films reste vide.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

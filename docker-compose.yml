services:
  db:
    image: postgres:16
    container_name: cineconnect-db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: cineconnect
      POSTGRES_PASSWORD: cineconnect
      POSTGRES_DB: cineconnect
    volumes:
      - cineconnect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineconnect -d cineconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineconnect-api
    ports:
      - "3001:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      DATABASE_URL: postgresql://cineconnect:cineconnect@db:5432/cineconnect
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: cineconnect-adminer
    ports:
      - "8083:8080"
    depends_on:
      - db

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
        VITE_SOCKET_URL: http://localhost:3001
    container_name: cineconnect-web
    ports:
      - "5173:8080"
    depends_on:
      - api

  # Remplit le catalogue avec quelques films si la table est vide (aucune clé API).
  # Usage : docker compose --profile seed up seed
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cineconnect-seed
    environment:
      DATABASE_URL: postgresql://cineconnect:cineconnect@db:5432/cineconnect
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["pnpm", "seed:demo"]

volumes:
  cineconnect_pg:
